# Enforce Node and pnpm versions specified in `engines` field of `package.json`
engineStrict: true

# Use whichever pnpm version is available in the environment
pmOnFail: ignore

# Manage peer dependencies explicitly and predictibly
strictPeerDependencies: true
dedupePeerDependents: false

# Approve specific build scripts
allowBuilds:
  core-js: false # of jspdf: pnpm install fails on unlisted build scripts
  esbuild: true

# Relax minimum release age protection for owned packages
minimumReleaseAgeExclude:
  - '@h5web/*'
  - '@esrf/eslint-config'

# Save exact dependency versions in `package.json`
savePrefix: ''

# Forked H5Web and h5wasm builds (transitive deps of `@h5web/app` and `@h5web/h5wasm`)
overrides:
  '@h5web/lib': file:vendor/h5web-lib-18.0.0-beta.3-fa13097.tgz
  h5wasm: file:vendor/h5wasm-0.10.3-fork-faf4a68.tgz

# Pre-existing peer mismatches in lint tooling, surfaced when the lockfile is re-resolved
peerDependencyRules:
  allowedVersions:
    '@vitest/mocker>vite': '8'
    storybook: '9'
